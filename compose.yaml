services:
  soc-dashboard:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SOC_DB_PATH: /app/data/soc.sqlite3
    volumes:
      - soc-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  soc-data:
