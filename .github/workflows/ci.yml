name: SOC dashboard checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests scripts
      - run: python -m ruff format --check app tests scripts
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check
          path: test-results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t soc-dashboard:test .
      - name: Start container and verify ingestion
        shell: bash
        run: |
          docker run -d --name soc-smoke -p 127.0.0.1:8000:8000 soc-dashboard:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -fsS -X POST -H 'X-SOC-Client: dashboard' http://127.0.0.1:8000/api/demo
          curl -fsS http://127.0.0.1:8000/api/dashboard | python -c 'import json,sys; d=json.load(sys.stdin); assert d["total_events"]==553; assert d["total_alerts"]==18'
          test "$(docker exec soc-smoke id -u)" = "10001"
          docker restart soc-smoke
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/dashboard | python -c 'import json,sys; assert json.load(sys.stdin)["total_events"]==553'
      - name: Container logs
        if: always()
        run: docker logs soc-smoke
